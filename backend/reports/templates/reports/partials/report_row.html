<tr id="report-{{ report.pk }}">
  <td>
    <div class="report-title-cell">
      <span class="report-title-cell__name">{{ report.name }}</span>
      <div class="report-title-cell__meta">
        <span class="report-chip">Reporte</span>
        <span>{{ report.created_at|timesince }} atrás</span>
      </div>
    </div>
  </td>
  <td class="report-description-cell">
    {% if report.description %}
      {{ report.description|truncatechars:180|linebreaksbr }}
    {% else %}
      <span class="muted">Sin descripción adicional.</span>
    {% endif %}
  </td>
  <td class="report-timestamp">{{ report.created_at|date:"d/m/Y H:i" }}</td>
  <td class="row-actions">
    <button
      class="link"
      hx-get="{% url 'reports:update' report.pk %}"
      hx-target="#report-modal-body"
      hx-swap="innerHTML"
      data-modal-trigger="#report-modal"
    >Editar</button>
    <button
      class="link danger"
      hx-delete="{% url 'reports:delete' report.pk %}"
      hx-target="#report-{{ report.pk }}"
      hx-swap="outerHTML"
      hx-confirm="¿Eliminar este reporte?"
      data-confirm-title="Eliminar reporte"
      data-confirm-icon="warning"
      data-confirm-button-text="Sí, eliminar"
      data-cancel-button-text="Cancelar"
      data-confirm-button-color="#d33"
      data-cancel-button-color="#64748b"
    >Eliminar</button>
  </td>
</tr>
